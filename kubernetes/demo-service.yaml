---
apiVersion: v1
kind: Service
metadata:
  name: demo
  labels:
    app: demo
spec:
  type: NodePort
  selector:
    app: demo
  ports:
    - protocol: TCP
      port: 8081
      name: http

        ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
spec:
  selector:
    matchLabels:
      app: demo
  replicas: 1
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
        - name: demo
          image: ap3120/demo:latest
          ports:
            - containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 8025
            initialDelaySeconds: 30
            timeoutSeconds: 1
